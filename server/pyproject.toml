[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stem-separator-server"
version = "0.2.0"
description = "Headless CUDA stem separation server and WebUI for WSL2/Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "packaging>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
stem-separator-server = "stem_separator_server.cli:main"
stem-separator-server-update = "stem_separator_server.cli:update_main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=9.0.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/stem_separator_server"]
artifacts = ["src/stem_separator_server/web/**"]
