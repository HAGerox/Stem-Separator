[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stem-separator-server"
version = "0.1.3"
description = "Headless CUDA stem separation server and WebUI for WSL2/Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
stem-separator-server = "stem_separator_server.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/stem_separator_server"]
artifacts = ["src/stem_separator_server/web/**"]
