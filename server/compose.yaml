services:
  stem-separator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${STEM_SEPARATOR_IMAGE:-ghcr.io/hagerox/stem-separator-server:latest}
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - stem-separator-data:/data
      - stem-separator-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  stem-separator-data:
  stem-separator-models:
