name: Build WSL CUDA server

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "catalog/**"
      - "package*.json"
      - ".github/workflows/build-wsl-cuda-server.yml"

permissions:
  contents: read

concurrency:
  group: wsl-cuda-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
          enable-cache: true
      - name: Build server wheel
        run: uv build --wheel --out-dir artifacts server
      - name: Smoke-test server package
        run: |
          uv venv .server-test --python 3.12
          uv pip install --python .server-test/bin/python "server[test]"
          .server-test/bin/pytest -q server/tests
          uv pip install --python .server-test/bin/python --force-reinstall artifacts/*.whl
          STEM_SEPARATOR_DATA_DIR="$RUNNER_TEMP/stem-separator" .server-test/bin/python -c "from stem_separator_server.app import app, environment_payload; assert app.title == 'Stem Separator Server'; print(environment_payload())"
      - name: Stage WSL installer
        run: |
          cp server/scripts/install-wsl.sh artifacts/
          cp server/README.md artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stem-separator-wsl-cuda-server
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  server-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: python-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stem-separator-wsl-cuda-server
          path: artifacts
      - name: Attest server wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.whl
      - name: Publish server release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            gh release view "$GITHUB_REF_NAME" >/dev/null && break
            sleep 3
          done
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

  cuda-container-ci:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build CUDA image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./server
          platforms: linux/amd64
          load: true
          tags: ghcr.io/hagerox/stem-separator-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image without a GPU
        run: |
          docker run -d --name stem-separator-ci -p 127.0.0.1:17860:7860 ghcr.io/hagerox/stem-separator-server:ci
          docker exec stem-separator-ci audio-separator --version
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:17860/healthz; then exit 0; fi
            sleep 2
          done
          docker logs stem-separator-ci
          exit 1

  cuda-container-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CUDA image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hagerox/stem-separator-server:${{ github.ref_name }}
            ghcr.io/hagerox/stem-separator-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/hagerox/stem-separator-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
