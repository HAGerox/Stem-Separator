name: Build WSL CUDA server

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "catalog/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/build-wsl-cuda-server.yml"

permissions:
  contents: read

concurrency:
  group: wsl-cuda-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Build shared server WebUI
        run: npm ci && npm run build:server-web
      - name: Build server wheel
        run: uv build --wheel --out-dir package-output server
      - name: Smoke-test server package
        run: |
          uv venv .server-test --python 3.12
          uv pip install --python .server-test/bin/python "./server[test]"
          .server-test/bin/pytest -q server/tests
          uv pip install --python .server-test/bin/python --force-reinstall package-output/*.whl
          STEM_SEPARATOR_DATA_DIR="$RUNNER_TEMP/stem-separator" .server-test/bin/python -c "from stem_separator_server.app import app, environment_payload; assert app.title == 'Stem Separator Server'; print(environment_payload())"
      - name: Stage WSL installer
        run: |
          mkdir -p artifacts bundle
          cp server/scripts/install-wsl.sh bundle/install.sh
          cp package-output/*.whl bundle/
          tar -czf "artifacts/Stem-Separator-Linux-WSL-CUDA.tar.gz" -C bundle .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stem-separator-wsl-cuda-server
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  server-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: python-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stem-separator-wsl-cuda-server
          path: artifacts
      - name: Attest server wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/Stem-Separator-Linux-WSL-CUDA.tar.gz
      - name: Publish server release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _attempt in {1..20}; do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null && break
            sleep 3
          done
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  cuda-container-ci:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check whether container integration changed
        id: container-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(\.dockerignore|server/(\.dockerignore|Dockerfile|compose.yaml|pyproject.toml|uv.lock|scripts/)|\.github/workflows/build-wsl-cuda-server.yml)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Python, WebUI, and package tests cover this change; skipping the multi-gigabyte CUDA image export."
          fi
      - if: steps.container-changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build CUDA image
        if: steps.container-changes.outputs.required == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/hagerox/stem-separator-server:ci
          cache-from: type=registry,ref=ghcr.io/hagerox/stem-separator-server:buildcache
      - name: Smoke-test image without a GPU
        if: steps.container-changes.outputs.required == 'true'
        run: |
          docker run -d --name stem-separator-ci -p 127.0.0.1:17860:7860 ghcr.io/hagerox/stem-separator-server:ci
          docker exec stem-separator-ci audio-separator --version
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:17860/healthz; then exit 0; fi
            sleep 2
          done
          docker logs stem-separator-ci
          exit 1

  cuda-container-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CUDA image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hagerox/stem-separator-server:${{ github.ref_name }}
            ghcr.io/hagerox/stem-separator-server:latest
          cache-from: type=registry,ref=ghcr.io/hagerox/stem-separator-server:buildcache
          cache-to: type=registry,ref=ghcr.io/hagerox/stem-separator-server:buildcache,mode=max,compression=zstd,oci-mediatypes=true,ignore-error=true
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/hagerox/stem-separator-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
