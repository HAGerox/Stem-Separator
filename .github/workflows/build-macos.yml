name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "catalog/**"
      - "scripts/prepare-macos-resources.sh"
      - "scripts/package-macos-dmg.sh"
      - "package*.json"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate updater signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY"

      - name: Prepare bundled FFmpeg and PAS runtime
        run: ./scripts/prepare-macos-resources.sh

      - name: Build unsigned app
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run tauri:build -- --bundles app
          else
            npm run tauri:build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Verify bundled runtime
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/Resources/bin/ffmpeg"
          test -x "$APP_PATH/Contents/Resources/bin/ffprobe"
          test -x "$APP_PATH/Contents/Resources/bin/audio-separator"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          "$APP_PATH/Contents/Resources/bin/ffmpeg" -version
          "$APP_PATH/Contents/Resources/bin/audio-separator" --version

      - name: Stage build artifacts
        run: |
          mkdir -p artifacts
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          ./scripts/package-macos-dmg.sh "$APP_PATH" artifacts/Stem-Separator-macOS-arm64.dmg
          codesign --force --sign - artifacts/Stem-Separator-macOS-arm64.dmg
          codesign --verify --verbose=2 artifacts/Stem-Separator-macOS-arm64.dmg
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz artifacts/Stem-Separator-macOS-arm64.app.tar.gz
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig artifacts/Stem-Separator-macOS-arm64.app.tar.gz.sig
          fi

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SIGNATURE="$(cat artifacts/Stem-Separator-macOS-arm64.app.tar.gz.sig)"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the GitHub release notes for Stem Separator $VERSION." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/HAGerox/Stem-Separator/releases/download/$RELEASE_TAG/Stem-Separator-macOS-arm64.app.tar.gz" \
            --arg signature "$SIGNATURE" \
            '{version:$version,notes:$notes,pub_date:$date,platforms:{"darwin-aarch64":{url:$url,signature:$signature}}}' \
            > artifacts/latest.json
          rm artifacts/Stem-Separator-macOS-arm64.app.tar.gz.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stem-separator-macos-arm64-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stem-separator-macos-arm64-unsigned
          path: artifacts

      - name: Attest macOS release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/Stem-Separator-macOS-arm64.app.tar.gz
            artifacts/Stem-Separator-macOS-arm64.dmg

      - name: Publish macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null && break
            sleep 3
          done
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
