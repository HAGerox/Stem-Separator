[package]
name = "stem-separator"
version = "0.2.6"
description = "A simple, intelligent stem separation desktop app"
authors = ["Stem Separator"]
edition = "2021"

[lib]
name = "stem_separator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-drag = "2.1.1"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread"] }
walkdir = "2"
which = "8"
libc = "0.2"
reqwest = "0.13"
sha2 = "0.10"
